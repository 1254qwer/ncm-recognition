[package]
name = "ncm-recognition"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
flate2 = "1"
md-5 = "0.10"
rustfft = "6"
rusty_aac = { version = "=2.0.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
